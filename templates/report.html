{% extends "base.html" %}

{% block title %}Report - Waypoint{% endblock %}

{% block content %}
<h1>Submit a Report</h1>

<form method="post">
    {% csrf_token %}

    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name" required>

    <button type="submit">Submit Report</button>
</form>
{% endblock %}
