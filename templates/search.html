{% extends "base.html" %}

{% block title %}Search - Waypoint{% endblock %}

{% block content %}
<h1>Search</h1>

<form method="get">
    <label for="q">Search:</label>
    <input type="text" id="q" name="q" value="{{ query }}">
    <button type="submit">Search</button>
</form>

{% if query %}
    <p>Search results for: {{ query }}</p>
{% endif %}
{% endblock %}
